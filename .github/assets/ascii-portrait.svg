<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-label="ASCII portrait of Darryll B. Eral">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020c08"/><stop offset="0.52" stop-color="#061810"/><stop offset="1" stop-color="#0a2419"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00a86b"/><stop offset="0.5" stop-color="#39ff88"/><stop offset="1" stop-color="#00a86b"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1b6d49"/><stop offset="0.3" stop-color="#9af7c4"/><stop offset="0.62" stop-color="#39ff88"/><stop offset="1" stop-color="#12784c"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#39ff88" stop-opacity="0"/><stop offset="0.5" stop-color="#39ff88" stop-opacity="0.09"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity="0.025"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="textGlow" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="0.35" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:800 25px 'Segoe UI',Arial,sans-serif;letter-spacing:7px;fill:#e9fff5}
      .sub{font:600 9px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#79b99a}
      .ascii{font-family:Consolas,'Courier New',monospace;font-size:7.25px;font-weight:700;white-space:pre;fill:url(#glyph);letter-spacing:0}
      .scanner{animation:scanline 7s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes scanline{from{transform:translateY(-100px)}to{transform:translateY(840px)}}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    </style>
  </defs>
