<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-label="Darryll's technology skills matrix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03120c"/>
      <stop offset="0.52" stop-color="#071a12"/>
      <stop offset="1" stop-color="#0a2419"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00a86b"/>
      <stop offset="0.5" stop-color="#39ff88"/>
      <stop offset="1" stop-color="#00a86b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff88" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:800 30px 'Segoe UI',Arial,sans-serif;letter-spacing:7px;fill:#e9fff5}
      .sub{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#79b99a}
      .cat{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#39ff88}
      .pill{fill:#092319;stroke:#00c878;stroke-width:1.4}
      .pillText{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#c8ffe2}
      .trace{fill:none;stroke:#39ff88;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:30 300;animation:trace 5s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .scanner{animation:scanline 7s linear infinite}
      @keyframes trace{to{stroke-dashoffset:-330}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes scanline{from{transform:translateY(-100px)}to{transform:translateY(610px)}}
    </style>
  </defs>

  <rect width="900" height="510" rx="20" fill="url(#bg)"/>
  <rect width="900" height="510" rx="20" fill="url(#grid)"/>
  <rect x="3" y="3" width="894" height="504" rx="17" fill="none" stroke="url(#frame)" stroke-width="2" opacity="0.7"/>
  <rect x="11" y="11" width="878" height="488" rx="13" fill="none" stroke="#39ff88" stroke-opacity="0.12"/>

  <path d="M28 65V28H70M830 28h42v37M28 445v37h42M830 482h42v-37" fill="none" stroke="#39ff88" stroke-width="2" filter="url(#soft)"/>
  <path d="M90 70H315m270 0h225" stroke="#00a86b" stroke-opacity="0.32"/>
  <circle cx="316" cy="70" r="3" fill="#39ff88" class="pulse"/>
  <circle cx="584" cy="70" r="3" fill="#39ff88" class="pulse" style="animation-delay:.8s"/>

  <text x="450" y="54" text-anchor="middle" class="title" filter="url(#soft)">TECH MATRIX</text>
  <text x="450" y="82" text-anchor="middle" class="sub">// CAPABILITY INDEX — ONLINE</text>

  <text x="450" y="127" text-anchor="middle" class="cat" filter="url(#soft)">LANGUAGES &amp; FRONTEND</text>
  <path d="M375 138H525" stroke="#39ff88" stroke-opacity="0.45"/>
  <g><rect x="186" y="154" width="104" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="186" y="154" width="104" height="38" rx="10" class="trace"/><text x="238" y="178" text-anchor="middle" class="pillText">JAVA</text></g>
  <g><rect x="302" y="154" width="132" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="302" y="154" width="132" height="38" rx="10" class="trace" style="animation-delay:.3s"/><text x="368" y="178" text-anchor="middle" class="pillText">JAVASCRIPT</text></g>
  <g><rect x="446" y="154" width="104" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="446" y="154" width="104" height="38" rx="10" class="trace" style="animation-delay:.6s"/><text x="498" y="178" text-anchor="middle" class="pillText">HTML5</text></g>
  <g><rect x="562" y="154" width="104" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="562" y="154" width="104" height="38" rx="10" class="trace" style="animation-delay:.9s"/><text x="614" y="178" text-anchor="middle" class="pillText">CSS3</text></g>

  <text x="450" y="237" text-anchor="middle" class="cat" filter="url(#soft)">CLOUD &amp; TOOLING</text>
  <path d="M390 248H510" stroke="#39ff88" stroke-opacity="0.45"/>
  <g><rect x="218" y="264" width="92" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="218" y="264" width="92" height="38" rx="10" class="trace" style="animation-delay:.2s"/><text x="264" y="288" text-anchor="middle" class="pillText">AWS</text></g>
  <g><rect x="322" y="264" width="92" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="322" y="264" width="92" height="38" rx="10" class="trace" style="animation-delay:.5s"/><text x="368" y="288" text-anchor="middle" class="pillText">GIT</text></g>
  <g><rect x="426" y="264" width="112" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="426" y="264" width="112" height="38" rx="10" class="trace" style="animation-delay:.8s"/><text x="482" y="288" text-anchor="middle" class="pillText">GITHUB</text></g>
  <g><rect x="550" y="264" width="132" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="550" y="264" width="132" height="38" rx="10" class="trace" style="animation-delay:1.1s"/><text x="616" y="288" text-anchor="middle" class="pillText">VS CODE</text></g>

  <text x="450" y="347" text-anchor="middle" class="cat" filter="url(#soft)">FOCUS SECTORS</text>
  <path d="M398 358H502" stroke="#39ff88" stroke-opacity="0.45"/>
  <g><rect x="72" y="374" width="154" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="72" y="374" width="154" height="38" rx="10" class="trace" style="animation-delay:.1s"/><text x="149" y="398" text-anchor="middle" class="pillText">WEB DEVELOPMENT</text></g>
  <g><rect x="238" y="374" width="166" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="238" y="374" width="166" height="38" rx="10" class="trace" style="animation-delay:.4s"/><text x="321" y="398" text-anchor="middle" class="pillText">MOBILE DEVELOPMENT</text></g>
  <g><rect x="416" y="374" width="74" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="416" y="374" width="74" height="38" rx="10" class="trace" style="animation-delay:.7s"/><text x="453" y="398" text-anchor="middle" class="pillText">AI</text></g>
  <g><rect x="502" y="374" width="142" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="502" y="374" width="142" height="38" rx="10" class="trace" style="animation-delay:1s"/><text x="573" y="398" text-anchor="middle" class="pillText">CYBERSECURITY</text></g>
  <g><rect x="656" y="374" width="172" height="38" rx="10" class="pill" filter="url(#soft)"/><rect x="656" y="374" width="172" height="38" rx="10" class="trace" style="animation-delay:1.3s"/><text x="742" y="398" text-anchor="middle" class="pillText">CLOUD ARCHITECTURE</text></g>

  <path d="M135 455h220l18 14h154l18-14h220" fill="none" stroke="#00a86b" stroke-opacity="0.35"/>
  <circle cx="450" cy="469" r="4" fill="#39ff88" filter="url(#glow)" class="pulse"/>
  <text x="450" y="493" text-anchor="middle" class="sub">BUILD // LEARN // SHIP</text>
  <rect x="0" y="-100" width="900" height="100" fill="url(#scan)" class="scanner"/>
</svg>
