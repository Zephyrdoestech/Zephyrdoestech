<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="Darryll B. Eral — BSIT student and developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020c08"/><stop offset="0.55" stop-color="#061810"/><stop offset="1" stop-color="#0a2419"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00a86b"/><stop offset="0.5" stop-color="#39ff88"/><stop offset="1" stop-color="#00a86b"/></linearGradient>
    <linearGradient id="photoTint" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00c878" stop-opacity="0.15"/><stop offset="0.55" stop-color="#071a12" stop-opacity="0"/><stop offset="1" stop-color="#071a12" stop-opacity="0.35"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39ff88" stop-opacity="0"/><stop offset="0.5" stop-color="#39ff88" stop-opacity="0.13"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity="0.03"/></pattern>
    <clipPath id="portraitClip"><rect x="48" y="69" width="242" height="272" rx="15"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .name{font:900 40px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#e9fff5}
      .role{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:2.5px;fill:#39ff88}
      .meta{font:700 10px 'Segoe UI',Arial,sans-serif;letter-spacing:2.5px;fill:#79b99a}
      .button{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.7px;fill:#e9fff5}
      .micro{font:600 9px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#4b896a}
      .label{font:700 8px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#79b99a}
      .pulse{animation:pulse 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .scan{animation:scan 6s linear infinite}.signal{animation:signal 4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
      @keyframes scan{from{transform:translateX(-900px)}to{transform:translateX(900px)}}
      @keyframes signal{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
  </defs>

  <rect width="900" height="370" rx="20" fill="url(#bg)"/><rect width="900" height="370" rx="20" fill="url(#grid)"/>
  <rect x="3" y="3" width="894" height="364" rx="17" fill="none" stroke="url(#frame)" stroke-width="2" opacity="0.75"/>
  <rect x="11" y="11" width="878" height="348" rx="13" fill="none" stroke="#39ff88" stroke-opacity="0.12"/>
  <path d="M28 68V28h42M830 28h42v40M28 302v40h42M830 342h42v-40" fill="none" stroke="#39ff88" stroke-width="2" filter="url(#soft)"/>
  <path d="M90 52h145l24 16h382l24-16h145" fill="none" stroke="#00a86b" stroke-opacity="0.3"/>
  <circle cx="259" cy="68" r="3" fill="#39ff88" class="pulse"/><circle cx="641" cy="68" r="3" fill="#39ff88" class="pulse" style="animation-delay:.8s"/>
  <text x="593" y="35" text-anchor="middle" class="micro">PROFILE NODE // ZEPHYRDOESTECH</text>

  <rect x="42" y="63" width="254" height="284" rx="18" fill="#092319" stroke="#00a86b" stroke-width="1.8" filter="url(#soft)"/>
  <image href="https://raw.githubusercontent.com/Zephyrdoestech/Zephyrdoestech/main/.github/assets/portrait-header.jpg" x="48" y="69" width="242" height="272" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
  <rect x="48" y="69" width="242" height="272" rx="15" fill="url(#photoTint)" clip-path="url(#portraitClip)"/>
  <rect x="48" y="69" width="242" height="272" rx="15" fill="none" stroke="#39ff88" stroke-opacity="0.9" stroke-width="1.4"/>
  <path d="M61 95V82h15M262 82h15v13M61 315v13h15M262 328h15v-13" fill="none" stroke="#39ff88" stroke-width="2" filter="url(#glow)"/>
  <rect x="59" y="305" width="116" height="20" rx="5" fill="#03120c" fill-opacity="0.75" stroke="#00a86b" stroke-opacity="0.55"/>
  <circle cx="72" cy="315" r="3" fill="#39ff88" class="pulse"/><text x="82" y="318" class="label">VISUAL ID // 01</text>

  <path d="M320 84v224M320 84h15M320 308h15" fill="none" stroke="#00a86b" stroke-opacity="0.42"/>
  <text x="590" y="134" text-anchor="middle" class="name" filter="url(#glow)">DARRYLL B. ERAL</text>
  <text x="590" y="171" text-anchor="middle" class="role">BSIT STUDENT · MOBILE &amp; WEB DEVELOPER</text>
  <rect x="510" y="189" width="160" height="2" rx="1" fill="#39ff88" filter="url(#glow)"/>
  <text x="590" y="232" text-anchor="middle" class="meta">AI // CLOUD // CYBERSECURITY</text>
  <text x="590" y="257" text-anchor="middle" class="micro">CIT-U // CEBU, PHILIPPINES</text>
  <g filter="url(#soft)">
    <rect x="472" y="280" width="236" height="48" rx="12" fill="#092319" stroke="#39ff88" stroke-width="1.8"/>
    <path d="M485 295v-7h7M695 288h7v7M485 313v7h7M695 320h7v-7" fill="none" stroke="#00c878"/>
    <circle cx="502" cy="304" r="5" fill="#39ff88" class="pulse"/>
    <text x="600" y="309" text-anchor="middle" class="button">OPEN TO COLLABORATE</text>
  </g>
  <path d="M110 348h155l18-15h110M790 348H655l-18-15H527" fill="none" stroke="#00a86b" stroke-opacity="0.28"/>
  <circle cx="393" cy="333" r="2.5" fill="#39ff88" class="signal"/><circle cx="527" cy="333" r="2.5" fill="#39ff88" class="signal" style="animation-delay:1s"/>
  <rect x="-900" y="0" width="900" height="370" fill="url(#beam)" class="scan"/>
</svg>
