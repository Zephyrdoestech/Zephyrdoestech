<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="Darryll B. Eral — BSIT student and developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020c08"/>
      <stop offset="0.55" stop-color="#061810"/>
      <stop offset="1" stop-color="#0a2419"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00a86b"/>
      <stop offset="0.5" stop-color="#39ff88"/>
      <stop offset="1" stop-color="#00a86b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff88" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity="0.03"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name{font:900 52px 'Segoe UI',Arial,sans-serif;letter-spacing:5px;fill:#e9fff5}
      .role{font:700 17px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#39ff88}
      .meta{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#79b99a}
      .button{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#e9fff5}
      .micro{font:600 9px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#4b896a}
      .pulse{animation:pulse 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .scan{animation:scan 6s linear infinite}
      .signal{animation:signal 4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
      @keyframes scan{from{transform:translateX(-900px)}to{transform:translateX(900px)}}
      @keyframes signal{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
  </defs>

  <rect width="900" height="370" rx="20" fill="url(#bg)"/>
  <rect width="900" height="370" rx="20" fill="url(#grid)"/>
  <rect x="3" y="3" width="894" height="364" rx="17" fill="none" stroke="url(#frame)" stroke-width="2" opacity="0.75"/>
  <rect x="11" y="11" width="878" height="348" rx="13" fill="none" stroke="#39ff88" stroke-opacity="0.12"/>

  <path d="M28 68V28h42M830 28h42v40M28 302v40h42M830 342h42v-40" fill="none" stroke="#39ff88" stroke-width="2" filter="url(#soft)"/>
  <path d="M90 52h180l24 16h312l24-16h180" fill="none" stroke="#00a86b" stroke-opacity="0.3"/>
  <circle cx="294" cy="68" r="3" fill="#39ff88" class="pulse"/>
  <circle cx="606" cy="68" r="3" fill="#39ff88" class="pulse" style="animation-delay:.8s"/>
  <text x="450" y="35" text-anchor="middle" class="micro">PROFILE NODE // ZEPHYRDOESTECH</text>

  <text x="450" y="138" text-anchor="middle" class="name" filter="url(#glow)">DARRYLL B. ERAL</text>
  <text x="450" y="177" text-anchor="middle" class="role">BSIT STUDENT · MOBILE &amp; WEB DEVELOPER</text>
  <rect x="370" y="194" width="160" height="2" rx="1" fill="#39ff88" filter="url(#glow)"/>

  <text x="450" y="238" text-anchor="middle" class="meta">AI // CLOUD // CYBERSECURITY</text>
  <text x="450" y="264" text-anchor="middle" class="micro">CIT-U // CEBU, PHILIPPINES</text>

  <g filter="url(#soft)">
    <rect x="335" y="287" width="230" height="48" rx="12" fill="#092319" stroke="#39ff88" stroke-width="1.8"/>
    <path d="M348 302v-7h7M552 295h7v7M348 320v7h7M552 327h7v-7" fill="none" stroke="#00c878"/>
    <circle cx="365" cy="311" r="5" fill="#39ff88" class="pulse"/>
    <text x="462" y="316" text-anchor="middle" class="button">OPEN TO COLLABORATE</text>
  </g>

  <path d="M110 322h125l18 16h112M790 322H665l-18 16H535" fill="none" stroke="#00a86b" stroke-opacity="0.28"/>
  <circle cx="365" cy="338" r="2.5" fill="#39ff88" class="signal"/>
  <circle cx="535" cy="338" r="2.5" fill="#39ff88" class="signal" style="animation-delay:1s"/>
  <rect x="-900" y="0" width="900" height="370" fill="url(#beam)" class="scan"/>
</svg>
