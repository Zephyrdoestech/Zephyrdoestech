<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="Darryll's current mission">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03120c"/><stop offset="1" stop-color="#0a2419"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".03"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.title{font:800 25px 'Segoe UI',Arial,sans-serif;letter-spacing:6px;fill:#e9fff5}.sub{font:600 9px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#79b99a}.num{font:800 20px 'Segoe UI',Arial,sans-serif;fill:#39ff88}.head{font:800 14px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#e9fff5}.body{font:500 12px 'Segoe UI',Arial,sans-serif;fill:#79b99a}.trace{animation:t 4s linear infinite;stroke-dasharray:28 500}@keyframes t{to{stroke-dashoffset:-528}}</style>
  </defs>
  <rect width="900" height="350" rx="18" fill="url(#bg)"/><rect width="900" height="350" rx="18" fill="url(#grid)"/>
  <rect x="3" y="3" width="894" height="344" rx="15" fill="none" stroke="#00c878" stroke-width="2" opacity=".7"/>
  <path d="M25 58V25h38M837 25h38v33M25 292v33h38M837 325h38v-33" fill="none" stroke="#39ff88" stroke-width="2"/>
  <text x="450" y="43" text-anchor="middle" class="title" filter="url(#glow)">CURRENT MISSION</text>
  <text x="450" y="67" text-anchor="middle" class="sub">// ACTIVE OBJECTIVES — FOUR SIGNALS</text>
  <g><rect x="42" y="92" width="397" height="105" rx="13" fill="#071a12" stroke="#00a86b"/><rect x="42" y="92" width="397" height="105" rx="13" fill="none" stroke="#39ff88" stroke-width="1.5" class="trace"/><rect x="61" y="111" width="49" height="49" rx="10" fill="#092319" stroke="#00c878"/><text x="85" y="143" text-anchor="middle" class="num">01</text><text x="129" y="127" class="head">BUILD</text><text x="129" y="151" class="body"><tspan x="129">Creating practical mobile and web experiences</tspan><tspan x="129" dy="18">that turn ideas into usable products.</tspan></text></g>
  <g><rect x="461" y="92" width="397" height="105" rx="13" fill="#071a12" stroke="#00a86b"/><rect x="461" y="92" width="397" height="105" rx="13" fill="none" stroke="#39ff88" stroke-width="1.5" class="trace" style="animation-delay:.6s"/><rect x="480" y="111" width="49" height="49" rx="10" fill="#092319" stroke="#00c878"/><text x="504" y="143" text-anchor="middle" class="num">02</text><text x="548" y="127" class="head">EXPLORE</text><text x="548" y="151" class="body"><tspan x="548">Going deeper into AI, secure systems, AWS,</tspan><tspan x="548" dy="18">and modern cloud architecture.</tspan></text></g>
  <g><rect x="42" y="213" width="397" height="105" rx="13" fill="#071a12" stroke="#00a86b"/><rect x="42" y="213" width="397" height="105" rx="13" fill="none" stroke="#39ff88" stroke-width="1.5" class="trace" style="animation-delay:1.2s"/><rect x="61" y="232" width="49" height="49" rx="10" fill="#092319" stroke="#00c878"/><text x="85" y="264" text-anchor="middle" class="num">03</text><text x="129" y="248" class="head">CONNECT</text><text x="129" y="272" class="body"><tspan x="129">Learning with AWS Cloud Club - WildQuacc</tspan><tspan x="129" dy="18">and GDG on Campus CIT-U.</tspan></text></g>
  <g><rect x="461" y="213" width="397" height="105" rx="13" fill="#071a12" stroke="#00a86b"/><rect x="461" y="213" width="397" height="105" rx="13" fill="none" stroke="#39ff88" stroke-width="1.5" class="trace" style="animation-delay:1.8s"/><rect x="480" y="232" width="49" height="49" rx="10" fill="#092319" stroke="#00c878"/><text x="504" y="264" text-anchor="middle" class="num">04</text><text x="548" y="248" class="head">LEAD</text><text x="548" y="272" class="body"><tspan x="548">Supporting the student community as an</tspan><tspan x="548" dy="18">SSG IT Representative.</tspan></text></g>
</svg>
