<svg xmlns="http://www.w3.org/2000/svg" width="900" height="118" viewBox="0 0 900 118" role="img" aria-label="Connect with Darryll">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="line"><stop stop-color="#071a12"/><stop offset=".5" stop-color="#39ff88"/><stop offset="1" stop-color="#071a12"/></linearGradient>
    <style>.title{font:800 30px 'Segoe UI',Arial,sans-serif;letter-spacing:9px;fill:#e9fff5}.sub{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#79b99a}.pulse{animation:p 2s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}</style>
  </defs>
  <text x="450" y="43" text-anchor="middle" class="title" filter="url(#glow)">CONNECT</text>
  <text x="450" y="73" text-anchor="middle" class="sub">// ESTABLISHING UPLINK — DARRYLL B. ERAL</text>
  <rect x="55" y="98" width="790" height="1.5" fill="url(#line)"/>
  <circle cx="450" cy="98.5" r="4" fill="#39ff88" filter="url(#glow)" class="pulse"/>
</svg>
