<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="Darryll B. Eral profile identity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03120c"/><stop offset="1" stop-color="#0a2419"/></linearGradient>
    <linearGradient id="frame"><stop stop-color="#00a86b"/><stop offset=".5" stop-color="#39ff88"/><stop offset="1" stop-color="#00a86b"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".03"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.title{font:800 25px 'Segoe UI',Arial,sans-serif;letter-spacing:6px;fill:#e9fff5}.sub{font:600 9px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#79b99a}.label{font:700 10px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#39ff88}.value{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#c8ffe2}.chip{font:700 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#c8ffe2}.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.3}50%{opacity:1}}</style>
  </defs>
  <rect width="900" height="310" rx="18" fill="url(#bg)"/><rect width="900" height="310" rx="18" fill="url(#grid)"/>
  <rect x="3" y="3" width="894" height="304" rx="15" fill="none" stroke="url(#frame)" stroke-width="2" opacity=".72"/>
  <path d="M25 58V25h38M837 25h38v33M25 252v33h38M837 285h38v-33" fill="none" stroke="#39ff88" stroke-width="2"/>
  <text x="450" y="43" text-anchor="middle" class="title" filter="url(#glow)">IDENTITY NODE</text>
  <text x="450" y="67" text-anchor="middle" class="sub">// VERIFIED PROFILE DATA</text>
  <circle cx="130" cy="158" r="60" fill="#071a12" stroke="#00c878" stroke-width="2" filter="url(#glow)"/>
  <circle cx="130" cy="158" r="48" fill="none" stroke="#39ff88" stroke-opacity=".2" stroke-dasharray="4 7"/>
  <text x="130" y="153" text-anchor="middle" font-family="Consolas,monospace" font-size="24" font-weight="700" fill="#39ff88">DBE</text>
  <text x="130" y="177" text-anchor="middle" class="sub">USER // 01</text>
  <circle cx="174" cy="116" r="5" fill="#39ff88" class="pulse"/>
  <path d="M214 96v112M214 96h16M214 208h16" fill="none" stroke="#00a86b" stroke-opacity=".5"/>
  <text x="254" y="111" class="label">NAME</text><text x="380" y="111" class="value">Darryll B. Eral</text>
  <text x="254" y="145" class="label">ROLE</text><text x="380" y="145" class="value">BSIT Student &amp; Developer</text>
  <text x="254" y="179" class="label">SCHOOL</text><text x="380" y="179" class="value">Cebu Institute of Technology - University</text>
  <text x="254" y="213" class="label">LOCATION</text><text x="380" y="213" class="value">Cebu, Philippines</text>
  <path d="M254 225H820" stroke="#00a86b" stroke-opacity=".28"/>
  <g><rect x="245" y="246" width="76" height="30" rx="8" fill="#092319" stroke="#00c878"/><text x="283" y="265" text-anchor="middle" class="chip">AI</text></g>
  <g><rect x="333" y="246" width="146" height="30" rx="8" fill="#092319" stroke="#00c878"/><text x="406" y="265" text-anchor="middle" class="chip">WEB &amp; MOBILE</text></g>
  <g><rect x="491" y="246" width="146" height="30" rx="8" fill="#092319" stroke="#00c878"/><text x="564" y="265" text-anchor="middle" class="chip">CYBERSECURITY</text></g>
  <g><rect x="649" y="246" width="171" height="30" rx="8" fill="#092319" stroke="#00c878"/><text x="734" y="265" text-anchor="middle" class="chip">CLOUD ARCHITECTURE</text></g>
</svg>
